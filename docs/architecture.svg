<svg width="680" height="720" viewBox="0 0 680 720" xmlns="http://www.w3.org/2000/svg" role="img">
<title>RAG system architecture</title>
<desc>Pipeline diagram showing default PDFs and user uploads flowing through chunking and embedding into a Qdrant vector database, then through hybrid search and re-ranking, an Ollama Cloud LLM, and finally the Streamlit chat interface.</desc>
<defs>
<marker id="arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M2 1L8 5L2 9" fill="none" stroke="#5F5E5A" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/></marker>
</defs>
 
<rect width="680" height="720" fill="#FFFFFF"/>
 
<g>
<rect x="140" y="40" width="180" height="56" rx="8" fill="#F1EFE8" stroke="#888780" stroke-width="0.5"/>
<text x="230" y="60" text-anchor="middle" dominant-baseline="central" font-family="sans-serif" font-size="14" font-weight="500" fill="#2C2C2A">Default library</text>
<text x="230" y="78" text-anchor="middle" dominant-baseline="central" font-family="sans-serif" font-size="12" fill="#444441">3 AWS PDFs</text>
</g>
 
<g>
<rect x="360" y="40" width="180" height="56" rx="8" fill="#F1EFE8" stroke="#888780" stroke-width="0.5"/>
<text x="450" y="60" text-anchor="middle" dominant-baseline="central" font-family="sans-serif" font-size="14" font-weight="500" fill="#2C2C2A">User upload</text>
<text x="450" y="78" text-anchor="middle" dominant-baseline="central" font-family="sans-serif" font-size="12" fill="#444441">Session-scoped PDF</text>
</g>
 
<path d="M230 96 L340 156" fill="none" stroke="#5F5E5A" stroke-width="1" marker-end="url(#arrow)"/>
<path d="M450 96 L340 156" fill="none" stroke="#5F5E5A" stroke-width="1" marker-end="url(#arrow)"/>
 
<g>
<rect x="210" y="156" width="260" height="56" rx="8" fill="#E1F5EE" stroke="#0F6E56" stroke-width="0.5"/>
<text x="340" y="176" text-anchor="middle" dominant-baseline="central" font-family="sans-serif" font-size="14" font-weight="500" fill="#04342C">Chunk and embed</text>
<text x="340" y="194" text-anchor="middle" dominant-baseline="central" font-family="sans-serif" font-size="12" fill="#085041">Loader, splitter, encoder</text>
</g>
 
<line x1="340" y1="212" x2="340" y2="272" stroke="#5F5E5A" stroke-width="1" marker-end="url(#arrow)"/>
 
<g>
<rect x="210" y="272" width="260" height="56" rx="8" fill="#EEEDFE" stroke="#534AB7" stroke-width="0.5"/>
<text x="340" y="292" text-anchor="middle" dominant-baseline="central" font-family="sans-serif" font-size="14" font-weight="500" fill="#26215C">Qdrant vector DB</text>
<text x="340" y="310" text-anchor="middle" dominant-baseline="central" font-family="sans-serif" font-size="12" fill="#3C3489">Default + upload collections</text>
</g>
 
<line x1="340" y1="328" x2="340" y2="388" stroke="#5F5E5A" stroke-width="1" marker-end="url(#arrow)"/>
 
<text x="60" y="420" text-anchor="start" font-family="sans-serif" font-size="12" fill="#444441">User question</text>
<line x1="140" y1="416" x2="208" y2="416" stroke="#5F5E5A" stroke-width="1" marker-end="url(#arrow)"/>
 
<g>
<rect x="210" y="388" width="260" height="56" rx="8" fill="#FAECE7" stroke="#993C1D" stroke-width="0.5"/>
<text x="340" y="408" text-anchor="middle" dominant-baseline="central" font-family="sans-serif" font-size="14" font-weight="500" fill="#4A1B0C">Hybrid search + re-rank</text>
<text x="340" y="426" text-anchor="middle" dominant-baseline="central" font-family="sans-serif" font-size="12" fill="#712B13">Vector + keyword, cross-encoder</text>
</g>
 
<line x1="340" y1="444" x2="340" y2="504" stroke="#5F5E5A" stroke-width="1" marker-end="url(#arrow)"/>
 
<g>
<rect x="210" y="504" width="260" height="56" rx="8" fill="#FAEEDA" stroke="#854F0B" stroke-width="0.5"/>
<text x="340" y="524" text-anchor="middle" dominant-baseline="central" font-family="sans-serif" font-size="14" font-weight="500" fill="#412402">Ollama Cloud LLM</text>
<text x="340" y="542" text-anchor="middle" dominant-baseline="central" font-family="sans-serif" font-size="12" fill="#633806">Grounded answer generation</text>
</g>
 
<line x1="340" y1="560" x2="340" y2="620" stroke="#5F5E5A" stroke-width="1" marker-end="url(#arrow)"/>
 
<g>
<rect x="210" y="620" width="260" height="56" rx="8" fill="#F1EFE8" stroke="#5F5E5A" stroke-width="0.5"/>
<text x="340" y="640" text-anchor="middle" dominant-baseline="central" font-family="sans-serif" font-size="14" font-weight="500" fill="#2C2C2A">Streamlit UI</text>
<text x="340" y="658" text-anchor="middle" dominant-baseline="central" font-family="sans-serif" font-size="12" fill="#444441">Chat, streaming, history</text>
</g>
 
<line x1="470" y1="648" x2="540" y2="648" stroke="#5F5E5A" stroke-width="1" marker-end="url(#arrow)"/>
<text x="546" y="652" text-anchor="start" font-family="sans-serif" font-size="12" fill="#444441">Answer</text>
</svg>
 